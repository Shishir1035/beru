<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Beru">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0614"/>
      <stop offset="1" stop-color="#1c1038"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4a8ff"/>
      <stop offset="1" stop-color="#7c4dff"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c4dff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- aura behind the emblem -->
  <circle cx="190" cy="165" r="150" fill="url(#aura)">
    <animate attributeName="r" values="140;165;140" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- ant emblem -->
  <g transform="translate(190 170)" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#7c4dff" stroke-width="7" fill="none">
      <path d="M-34,-80 Q-60,-140 -112,-156">
        <animateTransform attributeName="transform" type="rotate" values="-3 -34 -80;4 -34 -80;-3 -34 -80" dur="3s" repeatCount="indefinite"/>
      </path>
      <path d="M34,-80 Q60,-140 112,-156">
        <animateTransform attributeName="transform" type="rotate" values="3 34 -80;-4 34 -80;3 34 -80" dur="3s" repeatCount="indefinite"/>
      </path>
      <path d="M-26,58 Q-82,100 -30,124"/>
      <path d="M26,58 Q82,100 30,124"/>
    </g>
    <path d="M-72,-42 L-36,-88 L36,-88 L72,-42 L56,42 L0,84 L-56,42 Z" fill="#150c2e" stroke="#7c4dff" stroke-width="5"/>
    <path d="M-36,-88 L0,-60 L36,-88" fill="none" stroke="#4a2fa8" stroke-width="3"/>
    <g fill="#d4bcff">
      <path d="M-50,-22 L-12,-6 L-22,14 L-52,-2 Z"/>
      <path d="M50,-22 L12,-6 L22,14 L52,-2 Z"/>
      <animate attributeName="opacity" values="1;0.45;1" dur="2.4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- title -->
  <text x="390" y="190" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="128" font-weight="800" letter-spacing="14" fill="#7c4dff" filter="url(#soft)" opacity="0.7">BERU</text>
  <text x="390" y="190" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="128" font-weight="800" letter-spacing="14" fill="url(#title)">BERU</text>
  <text x="394" y="240" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="27" fill="#b9a7ff">Every click, from the keyboard.</text>

  <!-- hint labels popping in and out -->
  <g font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <g>
      <rect x="930" y="70" width="58" height="36" rx="9" fill="#150c2e" stroke="#7c4dff" stroke-width="2.5"/>
      <text x="959" y="95" fill="#ffe000">FD</text>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.1;0.5;0.6;1" dur="6s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="1040" y="130" width="58" height="36" rx="9" fill="#150c2e" stroke="#7c4dff" stroke-width="2.5"/>
      <text x="1069" y="155" fill="#ffe000">GH</text>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.15;0.3;0.65;0.75;1" dur="6s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="950" y="200" width="58" height="36" rx="9" fill="#150c2e" stroke="#7c4dff" stroke-width="2.5"/>
      <text x="979" y="225" fill="#ffe000">KG</text>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.45;0.8;0.9;1" dur="6s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
